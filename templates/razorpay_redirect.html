<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to payment...</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        body {
            background: #f3f4f6;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card-wrap {
            background: #fff;
            border-radius: 18px;
            border: 1px solid #e5e7eb;
            padding: 48px 32px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 14px 35px rgba(15,23,42,0.08);
        }
        .icon-wrap {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: #ecfdf5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }
    </style>
</head>
<body>
    <div class="card-wrap">
        <div class="icon-wrap">
            <div class="spinner-border text-success" style="width:2rem;height:2rem;" role="status"></div>
        </div>
        <h5 class="fw-semibold mb-1">Redirecting to Razorpay</h5>
        <p class="text-muted mb-0" style="font-size:0.85rem;">
            Please wait. You'll be taken to Razorpay's secure page.<br>
            Do not press back or refresh.
        </p>
        <p class="mt-3 mb-0" style="font-size:0.8rem; color:#9ca3af;">
            Amount: ₹{{ amount_display }}
        </p>
    </div>

    <!-- this form auto submits to Razorpay's hosted page -->
    <form id="rzp-form"
          action="https://api.razorpay.com/v1/checkout/embedded"
          method="POST">
        <input type="hidden" name="key_id"            value="{{ razorpay_key_id }}">
        <input type="hidden" name="order_id"          value="{{ razorpay_order_id }}">
        <input type="hidden" name="name"              value="Veintro">
        <input type="hidden" name="description"       value="Order #{{ order_id }}">
        <input type="hidden" name="prefill[name]"     value="{{ name }}">
        <input type="hidden" name="prefill[email]"    value="{{ email }}">
        <input type="hidden" name="prefill[contact]"  value="{{ phone }}"> 
        <input type="hidden" name="theme[color]"      value="#22c55e">
        <input type="hidden" name="callback_url"      value="{{ callback_url }}">
        <input type="hidden" name="cancel_url"        value="{{ cancel_url }}">
    </form>

    <script>
        window.onload = function() {
            document.getElementById('rzp-form').submit();
        };
    </script>
</body>
</html>
